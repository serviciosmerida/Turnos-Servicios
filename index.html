<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnos · Servigrúas Mérida</title>
<link rel="icon" type="image/png" sizes="512x512" href="logo3.png">
<link rel="apple-touch-icon" sizes="512x512" href="logo3.png">
<link rel="manifest" href="manifest_turnos.json">
<meta name="theme-color" content="#1A1A1A">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:      #1A1A1A;
    --cream:      #F7F5F0;
    --gray-light: #EEECE8;
    --gray-mid:   #D5D2CB;
    --gray-text:  #888580;
    --olive:      #4A5240;
    --olive-light:#EFF1EB;
    --amber:      #C8860A;
    --amber-light:#FFF8EC;
    --red:        #B03A2E;
    --red-light:  #FDECEA;
    --blue:       #1F5C9E;
    --blue-light: #EBF2FB;
    --green:      #2E7D32;
    --green-light:#EDF7EE;
    --purple:     #6B3FA0;
    --purple-light:#F3EEFB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--black); min-height: 100vh; }

  /* ── Topbar ── */
  .topbar { background: var(--black); color: #fff; padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  .topbar-brand { font-family: 'Bebas Neue', sans-serif; font-size: 1.25rem; letter-spacing: 2px; }
  .topbar-brand span { color: var(--amber); }
  .topbar-sub { font-size: .7rem; color: #aaa; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  /* ── Tabs ── */
  .tabs-bar {
    background: #fff; border-bottom: 1.5px solid var(--gray-light);
    display: flex; align-items: stretch; padding: 0 2rem; gap: 0;
  }
  .tab-btn {
    padding: .9rem 1.5rem; font-size: .82rem; font-weight: 600;
    border: none; background: none; cursor: pointer; color: var(--gray-text);
    border-bottom: 3px solid transparent; margin-bottom: -1.5px;
    transition: color .15s, border-color .15s; letter-spacing: .3px;
  }
  .tab-btn.active { color: var(--olive); border-bottom-color: var(--olive); }
  .tab-btn:hover:not(.active) { color: var(--black); }

  /* ── Nav bar (pestaña 1) ── */
  .nav-bar {
    background: #fff; border-bottom: 1.5px solid var(--gray-light);
    padding: .85rem 2rem; display: flex; align-items: center; gap: 1rem;
  }
  .nav-arrow {
    width: 34px; height: 34px; border-radius: 8px;
    border: 1.5px solid var(--gray-mid); background: #fff;
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .nav-arrow:hover { background: var(--olive-light); border-color: var(--olive); }
  .nav-month { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; min-width: 220px; }
  .nav-legend { margin-left: auto; display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: .4rem; font-size: .73rem; color: var(--gray-text); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }

  /* ── Content ── */
  .content { padding: 1.5rem 2rem 3rem; max-width: 860px; margin: 0 auto; }
  .empty-month { text-align: center; padding: 4rem 2rem; color: var(--gray-text); font-size: .9rem; }

  /* ── Weekend card ── */
  .weekend-card { background: #fff; border-radius: 14px; border: 1.5px solid var(--gray-light); margin-bottom: 1.1rem; overflow: hidden; }
  .weekend-card.proximo-card { border: 2px solid var(--amber); box-shadow: 0 2px 10px rgba(200,134,10,.25); }
  .proximo-pill {
    display: inline-block; background: var(--amber); color: #1A1A1A;
    font-size: .64rem; font-weight: 700; letter-spacing: .5px;
    padding: .15rem .55rem; border-radius: 20px; vertical-align: middle; margin-left: .4rem;
  }
  .wc-header { padding: .75rem 1.25rem; border-bottom: 1.5px solid var(--gray-light); background: var(--cream); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .wc-dates { font-weight: 600; font-size: .88rem; color: var(--black); }
  .wc-obs { font-size: .75rem; color: var(--red); font-style: italic; }
  .wc-viernes-aviso { font-size: .73rem; color: var(--amber); font-weight: 600; background: var(--amber-light); padding: .2rem .65rem; border-radius: 20px; white-space: nowrap; }
  .wc-body { display: grid; grid-template-columns: 1fr 1fr; }
  .wc-cubre { padding: 1.1rem 1.25rem; border-right: 1.5px solid var(--gray-light); display: flex; flex-direction: column; gap: .3rem; }
  .wc-cubre-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--olive); font-weight: 600; }
  .wc-cubre-name { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; line-height: 1; color: var(--olive); }
  .wc-cubre-name.long-name { font-size: 1.5rem; }
  .wc-cubre-detail { font-size: .73rem; color: var(--gray-text); }
  .wc-rest { padding: 1.1rem 1.25rem; display: flex; flex-direction: column; gap: .5rem; }
  .wc-rest-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--gray-text); font-weight: 600; }
  .pilot-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .pilot-name { font-size: .82rem; font-weight: 600; color: var(--black); }
  .pilot-badge { font-size: .7rem; font-weight: 500; padding: .2rem .65rem; border-radius: 20px; white-space: nowrap; }
  .badge-sabado   { background: var(--blue-light); color: var(--blue); }
  .badge-descanso { background: var(--gray-light);  color: var(--gray-text); }
  .wc-next { padding: .5rem 1.25rem; border-top: 1.5px solid var(--gray-light); display: flex; align-items: center; gap: .5rem; background: var(--cream); }
  .wc-next-label { font-size: .68rem; color: var(--gray-text); text-transform: uppercase; letter-spacing: 1px; }
  .wc-next-name  { font-size: .78rem; font-weight: 700; color: var(--amber); }

  /* ── Pestaña 2: Horarios semanales ── */
  .week-nav-bar {
    background: #fff; border-bottom: 1.5px solid var(--gray-light);
    padding: .85rem 2rem; display: flex; align-items: center; gap: 1rem;
  }
  .week-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; min-width: 280px; }

  .week-grid {
    display: grid;
    grid-template-columns: 120px repeat(5, 1fr);
    border: 1.5px solid var(--gray-light);
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    margin-bottom: 1.5rem;
  }
  .wg-cell {
    padding: .65rem .85rem;
    border-right: 1px solid var(--gray-light);
    border-bottom: 1px solid var(--gray-light);
    font-size: .8rem;
  }
  .wg-cell:nth-child(6n) { border-right: none; }
  .wg-header {
    background: var(--black); color: #fff;
    font-size: .68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px;
    padding: .55rem .85rem;
    display: flex; align-items: center;
  }
  .wg-header.day-col { justify-content: center; }
  .wg-pilot-label {
    background: var(--cream);
    font-weight: 700; font-size: .78rem;
    display: flex; align-items: center;
    border-right: 1.5px solid var(--gray-mid);
  }
  .wg-cell.today-col { background: var(--amber-light); border-left: 2px solid var(--amber); border-right: 2px solid var(--amber); }
  .wg-header.today-col { background: var(--amber) !important; color: #1A1A1A !important; font-weight: 700; }

  .hour-badge {
    display: inline-block;
    font-size: .72rem; font-weight: 600;
    padding: .18rem .55rem; border-radius: 20px;
    white-space: nowrap;
  }
  .h-5pm  { background: var(--gray-light);  color: var(--gray-text); }
  .h-6pm  { background: var(--blue-light);  color: var(--blue); }
  .h-7pm  { background: var(--green-light); color: var(--green); }
  .h-9pm  { background: var(--amber-light); color: var(--amber); }
  .h-9pm-special { background: #FFF0E0; color: var(--red); font-weight: 700; }
  .h-6pm-special { background: #FFF0E0; color: var(--red); font-weight: 700; }
  .h-nocturno { background: var(--purple-light); color: var(--purple); }
  .h-247 { background: var(--black); color: var(--amber); font-weight: 700; }
  .h-off  { background: var(--gray-light);  color: #bbb; font-style: italic; }

  /* ── Scroll horizontal para grillas anchas (escritorio/tablet) ── */
  .grid-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -1rem; padding: 0 1rem; }
  .grid-scroll::-webkit-scrollbar { height: 6px; }
  .grid-scroll::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 10px; }

  /* ── Vista vertical (móvil) — Horarios semanales ── */
  .week-cards { display: none; flex-direction: column; gap: .8rem; }
  .week-day-card { background: #fff; border: 1.5px solid var(--gray-light); border-radius: 14px; overflow: hidden; }
  .week-day-card.today-card { border: 2px solid var(--amber); box-shadow: 0 2px 10px rgba(200,134,10,.25); }
  .week-day-header {
    background: var(--black); color: #fff; padding: .6rem 1rem;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.05rem; letter-spacing: 1.5px;
  }
  .week-day-header.today { background: var(--amber); color: #1A1A1A; }
  .week-day-header .hoy-pill {
    display: inline-block; background: #1A1A1A; color: var(--amber);
    font-family: 'Inter', sans-serif; font-size: .62rem; font-weight: 700;
    letter-spacing: .5px; padding: .12rem .5rem; border-radius: 20px; margin-left: .5rem; vertical-align: middle;
  }
  .week-day-body { padding: .2rem 1rem; }
  .week-pilot-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: .6rem 0; border-bottom: 1px solid var(--gray-light);
  }
  .week-pilot-row:last-child { border-bottom: none; }
  .week-pilot-name { font-weight: 600; font-size: .85rem; }

  /* ══════════════════════════════════════════
     RESPONSIVE — TABLET Y MÓVIL
     ══════════════════════════════════════════ */
  @media (max-width: 768px) {
    .topbar { padding: .8rem 1rem; }
    .topbar-brand { font-size: 1.05rem; }
    .topbar-sub { font-size: .62rem; }

    .tabs-bar { padding: 0 .5rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .tab-btn { padding: .8rem .9rem; font-size: .74rem; white-space: nowrap; flex: 0 0 auto; }

    .nav-bar, .week-nav-bar {
      padding: .7rem .85rem; flex-wrap: wrap; row-gap: .6rem;
    }
    .nav-month, .week-label { font-size: 1.15rem; min-width: 0; flex: 1 1 auto; text-align: center; letter-spacing: 1px; }
    .nav-arrow { width: 30px; height: 30px; flex: 0 0 auto; }
    .nav-legend { width: 100%; margin-left: 0; justify-content: center; gap: .7rem; }
    .legend-item { font-size: .68rem; }

    .content { padding: 1rem .85rem 2.5rem; }

    /* Tarjetas de fin de semana: apilar en una sola columna */
    .wc-body { grid-template-columns: 1fr; }
    .wc-cubre { border-right: none; border-bottom: 1.5px solid var(--gray-light); }
    .wc-header { flex-wrap: wrap; gap: .4rem; }
    .wc-cubre-name { font-size: 1.9rem; }
    .wc-cubre-name.long-name { font-size: 1.25rem; }

    /* Horarios semanales: ocultar la grilla horizontal y mostrar tarjetas verticales */
    #week-grid-wrap { display: none; }
    .week-cards { display: flex; }
  }

  @media (max-width: 480px) {
    .topbar-brand { font-size: .95rem; }
    .nav-month, .week-label { font-size: 1rem; }
    .content { padding: .85rem .6rem 2rem; }
    .wc-cubre, .wc-rest { padding: .9rem 1rem; }
    .wc-cubre-name { font-size: 1.6rem; }
    .wc-cubre-name.long-name { font-size: 1.05rem; }
    .pilot-name { font-size: .78rem; }
    .pilot-badge { font-size: .66rem; }
  }
</style>
</head>

</div>

// LÓGICA DE HORARIOS
// ════════════════════════════════════════

// Alvaro/Osmar/Oliver turno nocturno: mié 17 jun = Osmar/Oliver, jue 18 = Alvaro, vie 19 = Osmar/Oliver, lun 22 = Alvaro...
// Referencia: 17/jun/2026 (mié) = Osmar/Oliver (índice 0)
const NOCTURNO_REF = new Date(2026, 5, 17); // mié 17 jun = Osmar/Oliver
function nocturnoDelDia(date) {
  const diff = Math.round((date - NOCTURNO_REF) / 86400000);
  return diff % 2 === 0 ? 'OSMAR/OLIVER' : 'ALVARO';
}

// ¿El viernes es el anterior al finde en que alguien descansa?
// El piloto que descansa ese finde debe salir a las 9PM ese viernes
function viernesDescansaPiloto(friDate) {
  // Buscar el sábado de esa semana (fri + 1)
  const sat = new Date(friDate); sat.setDate(sat.getDate() + 1);
  const we = WEEKENDS.find(w => {
    const ws = new Date(w.sat.y, w.sat.m, w.sat.d);
    return ws.getTime() === sat.getTime();
  });
  if (!we) return null;
  const descansa = we.pilotsInfo.find(p => p.turno === 'descansa');
  return descansa ? descansa.name : null;
}

// ¿Quién cubrió el fin de semana completo inmediatamente anterior a este lunes?
// Ese piloto sale a las 6PM el lunes (en vez de su horario normal)
function lunesCubrioFinde(monDate) {
  const sun = new Date(monDate); sun.setDate(sun.getDate() - 1);
  const we = WEEKENDS.find(w => {
    const ws = new Date(w.sun.y, w.sun.m, w.sun.d);
    return ws.getTime() === sun.getTime();
  });
  return we ? we.piloto : null;
}

// ESTADO UI
// ════════════════════════════════════════
let currentTab = 1;
let currentMonth = new Date().getMonth();
let currentYear  = new Date().getFullYear();

// Semana actual: lunes de esta semana
function getMondayOf(date) {
  const d = new Date(date);
  const day = d.getDay(); // 0=dom
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
let currentWeekMonday = getMondayOf(new Date());

function switchTab(n) {
  currentTab = n;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===n));
  document.getElementById('tab-0').style.display = n===0 ? '' : 'none';
  document.getElementById('tab-1').style.display = n===1 ? '' : 'none';
  if (n===1) renderWeek();
}

// ════════════════════════════════════════
// PESTAÑA 1: FINES DE SEMANA
// ════════════════════════════════════════
(function() {
  const now = new Date();
  const fut = WEEKENDS.find(w => new Date(w.sat.y, w.sat.m, w.sat.d) >= now);
  if (fut) { currentMonth = fut.sat.m; currentYear = fut.sat.y; }
})();

function cap(s) { return String(s).toLowerCase().replace(/\b\w/g, c => c.toUpperCase()).replace(/ Y /g, ' y '); }

function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderMonth();
}

function getProximoFinde() {
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return WEEKENDS.find(w => {
    const sun = new Date(w.sun.y, w.sun.m, w.sun.d);
    return sun >= hoy;
  });
}

function renderMonth() {
  document.getElementById('nav-month-label').textContent =
    MESES[currentMonth].toUpperCase() + ' ' + currentYear;

  const mes = WEEKENDS.filter(w => w.sat.m === currentMonth && w.sat.y === currentYear);
  const el  = document.getElementById('calendar-content');

  if (!mes.length) { el.innerHTML = '<div class="empty-month">Sin fines de semana registrados para este mes.</div>'; return; }

  const proximo = getProximoFinde();

  el.innerHTML = mes.map(w => {
    const sat = new Date(w.sat.y, w.sat.m, w.sat.d);
    const sun = new Date(w.sun.y, w.sun.m, w.sun.d);
    // Viernes anterior
    const fri = new Date(sat); fri.setDate(sat.getDate() - 1);
    const fmt = d => d.toLocaleDateString('es-GT', { weekday:'long', day:'numeric', month:'long' });
    const fmtFri = fri.toLocaleDateString('es-GT', { weekday:'long', day:'numeric', month:'long' });

    const esProximo = proximo && w.sat.d === proximo.sat.d && w.sat.m === proximo.sat.m && w.sat.y === proximo.sat.y;

    // Quién descansa ese fin de semana (para el aviso del viernes)
    const descansaPiloto = w.pilotsInfo.find(p => p.turno === 'descansa');

    const pilotsHTML = w.pilotsInfo.map(p => `
      <div class="pilot-row">
        <div class="pilot-name">${cap(p.name)}</div>
        <div class="pilot-badge ${p.turno === 'sabado' ? 'badge-sabado' : 'badge-descanso'}">
          ${p.turno === 'sabado' ? (p.name.toUpperCase() === 'DOUGLAS' ? 'Sábado 8AM–6PM' : 'Sábado hasta 5PM') : 'Descansa'}
        </div>
      </div>`).join('');

    return `
    <div class="weekend-card${esProximo ? ' proximo-card' : ''}">
      <div class="wc-header">
        <div class="wc-dates">${fmt(sat)} &mdash; ${fmt(sun)}${esProximo ? ' <span class="proximo-pill">PRÓXIMO</span>' : ''}</div>
        ${w.obs ? `<div class="wc-obs">⚠ ${w.obs}</div>` : ''}
        ${descansaPiloto ? `<div class="wc-viernes-aviso">⏰ ${cap(descansaPiloto.name)} sale 9PM el ${fmtFri}</div>` : ''}
      </div>
      <div class="wc-body">
        <div class="wc-cubre">
          <div class="wc-cubre-label">Fin de semana completo</div>
          <div class="wc-cubre-name${cap(w.piloto).length > 8 ? ' long-name' : ''}">${cap(w.piloto)}</div>
          <div class="wc-cubre-detail">Sábado completo · Domingo completo</div>
        </div>
        <div class="wc-rest">
          <div class="wc-rest-label">Resto de pilotos</div>
          ${pilotsHTML}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════
// PESTAÑA 2: HORARIOS SEMANALES
// ════════════════════════════════════════
function changeWeek(dir) {
  currentWeekMonday = new Date(currentWeekMonday);
  currentWeekMonday.setDate(currentWeekMonday.getDate() + dir * 7);
  renderWeek();
}

function badge(cls, text) { return `<span class="hour-badge ${cls}">${text}</span>`; }

function renderWeek() {
  const mon = new Date(currentWeekMonday);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const today = new Date(); today.setHours(0,0,0,0);

  // Label semana
  const fmtShort = d => d.toLocaleDateString('es-GT', { day:'numeric', month:'short' });
  document.getElementById('week-label').textContent =
    `Semana del ${fmtShort(mon)} al ${fmtShort(fri)}`;

  // Días de la semana (lun–vie)
  const days = Array.from({length:5}, (_,i) => { const d = new Date(mon); d.setDate(mon.getDate()+i); return d; });

  // ¿Quién descansa este viernes?
  const descansaViernes = viernesDescansaPiloto(fri);

  // ¿Quién cubrió el fin de semana completo anterior? (sale 6PM este lunes)
  const lunesPiloto = lunesCubrioFinde(mon);

  // Pilotos y su lógica por día
  const pilotos = [
    { name: 'Juan',          color: '#C8860A' },
    { name: 'Aldrin',        color: '#2E7D32' },
    { name: 'Douglas',       color: '#B03A2E' },
    { name: 'Osmar/Oliver', color: '#C8860A' },
    { name: 'Alvaro',        color: '#6B3FA0' },
  ];

  function getSalida(piloto, date, dayIdx) {
    const isFri = dayIdx === 4;
    const isMon = dayIdx === 0;
    const name = piloto.name.toUpperCase();

    if (name === 'JUAN') return badge('h-247', '24/7');

    if (isMon && lunesPiloto && name === lunesPiloto) {
      return badge('h-6pm-special', '6PM ⚠');
    }

    if (name === 'ALDRIN') {
      if (isFri && descansaViernes === 'ALDRIN') return badge('h-9pm-special', '9PM ⚠');
      return badge('h-7pm', '7PM');
    }

    if (name === 'DOUGLAS') {
      return badge('h-9pm', '9PM');
    }

    if (name === 'OSMAR/OLIVER') {
      const esNocturno = nocturnoDelDia(date) === 'OSMAR/OLIVER';
      return esNocturno ? badge('h-nocturno', 'Cubre') : badge('h-off', 'Turno normal');
    }

    if (name === 'ALVARO') {
      const esNocturno = nocturnoDelDia(date) === 'ALVARO';
      return esNocturno ? badge('h-nocturno', 'Cubre') : badge('h-off', 'Turno normal');
    }

    return '';
  }

  // Construir grid
  const todayCols = days.map(d => d.getTime() === today.getTime());

  let html = '';
  // Fila encabezado
  html += `<div class="wg-header">Piloto</div>`;
  days.forEach((d, i) => {
    const isToday = todayCols[i];
    const label = d.toLocaleDateString('es-GT', { weekday:'short', day:'numeric' });
    html += `<div class="wg-header day-col${isToday?' today-col':''}">${label}${isToday?' · HOY':''}</div>`;
  });

  // Filas de pilotos
  pilotos.forEach(p => {
    html += `<div class="wg-cell wg-pilot-label" style="color:${p.color}">${p.name}</div>`;
    days.forEach((d, i) => {
      const isToday = todayCols[i];
      html += `<div class="wg-cell${isToday?' today-col':''}" style="text-align:center">${getSalida(p, d, i)}</div>`;
    });
  });

  document.getElementById('week-grid').innerHTML = html;

  // ── Vista vertical para móvil (una tarjeta por día) ──
  let cardsHtml = '';
  days.forEach((d, i) => {
    const isToday = todayCols[i];
    const label = d.toLocaleDateString('es-GT', { weekday:'long', day:'numeric', month:'short' });
    cardsHtml += `<div class="week-day-card${isToday ? ' today-card' : ''}">
      <div class="week-day-header${isToday ? ' today' : ''}">${cap(label)}${isToday ? '<span class="hoy-pill">HOY</span>' : ''}</div>
      <div class="week-day-body">
        ${pilotos.map(p => `
          <div class="week-pilot-row">
            <div class="week-pilot-name" style="color:${p.color}">${p.name}</div>
            <div>${getSalida(p, d, i)}</div>
          </div>`).join('')}
      </div>
    </div>`;
  });
  document.getElementById('week-cards').innerHTML = cardsHtml;
}

renderMonth();
switchTab(1);
</script>
